name: Build manuscript PDF

on:
  push:
    branches:
      - paper/revision-literature-and-presentation
    paths:
      - 'docs/manuscript/**'
      - '.github/workflows/build-manuscript-pdf.yml'
  pull_request:
    paths:
      - 'docs/manuscript/**'
      - '.github/workflows/build-manuscript-pdf.yml'
  workflow_dispatch:

# Prevent multiple TeX installations/builds from racing for the same branch.
concurrency:
  group: manuscript-pdf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-manuscript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            poppler-utils

      - name: Build PDF
        working-directory: docs/manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Check PDF and report page count
        working-directory: docs/manuscript
        run: |
          test -s main.pdf
          pdfinfo main.pdf | grep -E '^(Pages|Page size|PDF version):'
          if grep -E 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log; then
            echo "Unresolved citations or references found."
            exit 1
          fi

      - name: Upload compiled manuscript
        uses: actions/upload-artifact@v4
        with:
          name: eBPF-research-manuscript-pdf
          path: docs/manuscript/main.pdf
          if-no-files-found: error
          retention-days: 14
