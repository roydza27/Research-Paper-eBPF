name: Split Bypass evaluation checks

on:
  pull_request:
    paths:
      - "research/analyzer/**"
      - "research/tests/**"
      - "research/experiments/scripts/split_analyze_bypass.py"
      - "research/experiments/tests/test_split_analyze_bypass.py"
      - "research/experiments/split_bypass/**"
      - ".github/workflows/split-bypass-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Stub unavailable KRAKENGUARD client for unit tests
        shell: bash
        run: |
          # The frozen baseline artifact is not checked into this repository checkout.
          # The test below imports the validator module to unit-test its verdict parser;
          # it must not invoke a live verifier. This fail-fast stub only satisfies import.
          client="research/baselines/krakenguard/artifact/daemon/krakenguard_client.py"
          if [ ! -f "$client" ]; then
            mkdir -p "$(dirname "$client")"
            printf '%s\n' 'class KrakenGuardClient:' '    def __init__(self, *args, **kwargs):' '        raise RuntimeError("KRAKENGUARD unavailable in unit-test CI; no service invocation allowed")' > "$client"
          fi
      - name: Existing abstract analyzer soundness tests
        run: python -m pytest -q research/tests/test_phase5_abstract_soundness.py
      - name: Existing E3/E4/E5 audit tests (tests only; no matrix execution)
        run: python -m pytest -q research/tests/test_phase5_e3_e4_e5_audit.py
      - name: Existing Split–Analyze–Bypass tests
        run: python -m pytest -q research/experiments/tests/test_split_analyze_bypass.py
      - name: Controlled corpus and analysis unit tests
        run: python -m pytest -q research/experiments/split_bypass/tests/test_controlled_evaluation.py
